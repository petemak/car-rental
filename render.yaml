# Render Blueprint — deployment config only, does not modify application
# source. See src/backend/Dockerfile for the image build.
#
# To use: push this repo to a Git host Render can read (GitHub/GitLab),
# then in the Render dashboard choose "New > Blueprint" and point it at
# the repo. Render will read this file and create the service below.
#
# IMPORTANT — read before/after first deploy:
#   1. CORS_ORIGINS below is a placeholder ("*"). Once the frontend is
#      live on its Cloudflare Pages URL (or a custom domain), narrow this
#      to that exact origin, e.g. "https://carrental.pages.dev".
#   2. DEV_PAYMENT_SIMULATION_ENABLED is deliberately set to the literal
#      string "false". Read src/backend/src/car_rental/backend/handlers/
#      payments.clj — the check is `(not= "false" ...)`, i.e. ANY value
#      other than the exact string "false" (including an unset/blank
#      var) is treated as ENABLED. Leaving this var unset would silently
#      leave the fake-payment-success endpoint live in production.
#   3. JWT_SECRET is auto-generated by Render at first deploy (see
#      generateValue below) — do not reuse the repo's dev default
#      ("dev-secret-change-me-please-1234567890").
#   4. This backend uses an in-memory store (see store/core.clj) — all
#      bookings/customers/reviews are lost on every restart or redeploy.
#      The "starter" plan below stays always-on (no idle sleep), which
#      avoids traffic-triggered restarts, but deploys, manual restarts,
#      and Render host maintenance will still wipe data. Do not treat
#      this as durable storage for real customer bookings.

services:
  - type: web
    name: car-rental-backend
    runtime: docker
    plan: starter # paid tier ($7/mo at time of writing) — always-on, no idle-sleep.
    dockerfilePath: src/backend/Dockerfile
    dockerContext: src/backend
    # No dedicated /health route exists in routes.clj; this repo has no
    # unauthenticated GET simpler than vehicle-categories, so use that as
    # a liveness probe instead of inventing a new endpoint (out of scope
    # for this deployment-only change).
    healthCheckPath: /api/v1/vehicle-categories
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # TODO: narrow to the deployed frontend origin once known
      - key: DEV_PAYMENT_SIMULATION_ENABLED
        value: "false"
