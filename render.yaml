# Render Blueprint — deployment config only, does not modify application
# source. See src/backend/Dockerfile for the image build.
#
# STAGING deployment (Phase 1 of the deployment-engineer two-phase
# process). This is deliberately a separate, free-tier service, not the
# production backend. See "Hosting research (2026-08-09)" below for why.
#
# To use: push this repo to a Git host Render can read (GitHub/GitLab),
# then in the Render dashboard choose "New > Blueprint" and point it at
# the repo. Render will read this file and create the service below.
# Render's free-plan services get their own *.onrender.com URL that is
# already distinct from whatever production hostname comes later — no
# separate "preview environment" purchase is needed for this step.
# (Render's formal per-PR Preview Environments feature requires a paid
# Professional/Pro *workspace* plan, independent of the per-service
# instance-type/plan below — not worth it just to get a staging URL.)
#
# Hosting research (2026-08-09), backend options compared:
#   - Render free web service: $0/mo. 512MB RAM / 0.1 CPU. Spins down
#     after 15 min idle, ~1 min cold-start on the next request.
#   - Render "starter": $7/mo. Same RAM, more CPU, always-on/no sleep.
#   - Fly.io: no free tier for new accounts as of 2026 (removed 2024);
#     pay-as-you-go, realistically ~$8-25/mo once egress and an
#     always-warm machine are accounted for.
#   - Railway: no true free plan either; Hobby is $5/mo minimum spend
#     plus usage on top.
#   Decision for STAGING: Render free plan. This backend's store is
#   in-memory (store/core.clj) with no persistence, so bookings/reviews/
#   customers are already lost on every restart *regardless* of plan —
#   paying $7-25/mo for "always-on" buys no data-durability benefit at
#   this stage, only avoids ~1 min cold-start latency while a human is
#   reviewing the demo. That's an acceptable trade for $0 during review.
#   Revisit for production (Phase 2): an always-on paid plan removes the
#   cold-start UX hit for real customers, but does NOT fix the underlying
#   data-loss risk — see qa-report.md "Known items for deployment to
#   carry forward" for the real fix (persistent storage) needed before
#   real customer traffic.
#
# IMPORTANT — read before/after first deploy:
#   1. CORS_ORIGINS below is a placeholder ("*"). Once the frontend
#      staging URL is known (Cloudflare Pages), narrow this to that
#      origin, e.g. "https://car-rental-frontend.pages.dev". Pages
#      preview deploys also get random per-deploy subdomains
#      (<hash>.car-rental-frontend.pages.dev), so "*" is left in place
#      for staging to avoid breaking preview testing; narrow this for
#      production once the final frontend domain is fixed.
#   2. DEV_PAYMENT_SIMULATION_ENABLED is deliberately set to the literal
#      string "false". Read src/backend/src/car_rental/backend/handlers/
#      payments.clj — the check is `(not= "false" ...)`, i.e. ANY value
#      other than the exact string "false" (including an unset/blank
#      var) is treated as ENABLED. Per qa-report.md this must stay
#      "false" for any publicly reachable deployment, staging included.
#   3. JWT_SECRET is auto-generated by Render at first deploy (see
#      generateValue below) — do not reuse the repo's dev default
#      ("dev-secret-change-me-please-1234567890").
#   4. In-memory store: see the research note above. A free-plan idle
#      spin-down here does not introduce a new risk — data was never
#      durable on this backend to begin with.
#   5. Per qa-report.md, the seeded demo accounts (admin@example.com /
#      admin123, staff@example.com / staff123, jane@example.com /
#      password123) are fine for this staging review but must not ship
#      to a real production deploy without being replaced/removed.

services:
  - type: web
    name: car-rental-backend-staging
    runtime: docker
    plan: free # staging tier — see "Hosting research" note above.
    dockerfilePath: src/backend/Dockerfile
    dockerContext: src/backend
    # No dedicated /health route exists in routes.clj; this repo has no
    # unauthenticated GET simpler than vehicle-categories, so use that as
    # a liveness probe instead of inventing a new endpoint (out of scope
    # for this deployment-only change).
    healthCheckPath: /api/v1/vehicle-categories
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*" # TODO: narrow to the deployed frontend origin once known
      - key: DEV_PAYMENT_SIMULATION_ENABLED
        value: "false"
