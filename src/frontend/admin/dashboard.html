<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Rwanda Roadways Admin</title>
  <meta name="description" content="At-a-glance operational status for Rwanda Roadways staff." />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-topbar">
    <button type="button" class="nav-toggle" id="sidebar-toggle" aria-label="Toggle menu" style="border-color:rgba(255,255,255,.5);">☰</button>
    <a class="admin-topbar__brand" href="dashboard.html">Rwanda Roadways <span style="opacity:.7;font-weight:400;">Admin</span></a>
    <div class="admin-topbar__user">
      <span id="admin-user-name">Staff</span>
      <button type="button" class="btn btn-outline-light btn-sm" id="admin-logout-btn">Log out</button>
    </div>
  </div>

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation">
      <ul class="admin-nav">
        <li><a href="dashboard.html" aria-current="page">Dashboard</a></li>
        <li><a href="fleet.html">Fleet</a></li>
        <li><a href="bookings.html">Bookings</a></li>
        <li><a href="customers.html">Customers</a></li>
        <li data-role-restricted><a href="pricing.html">Pricing</a></li>
        <li><a href="reviews.html">Reviews</a></li>
        <li><a href="content.html">Content</a></li>
        <li data-role-restricted><a href="users.html">Admin Users</a></li>
        <li data-role-restricted><a href="settings.html">Settings</a></li>
      </ul>
    </aside>

    <div class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Dashboard</h1>
          <p>Today's operational snapshot.</p>
        </div>
      </div>

      <div class="stat-grid" id="stat-grid" aria-live="polite">
        <div class="stat-card"><div class="skeleton" style="height:2.5rem;"></div></div>
        <div class="stat-card"><div class="skeleton" style="height:2.5rem;"></div></div>
        <div class="stat-card"><div class="skeleton" style="height:2.5rem;"></div></div>
        <div class="stat-card"><div class="skeleton" style="height:2.5rem;"></div></div>
      </div>

      <div class="admin-panel">
        <h2>Quick links</h2>
        <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
          <a class="btn btn-outline" href="bookings.html">View bookings</a>
          <a class="btn btn-outline" href="fleet.html">Manage fleet</a>
          <a class="btn btn-outline" href="reviews.html">Moderate reviews</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/data/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/admin-shell.js"></script>
  <script src="../js/pages/admin-dashboard.js"></script>
</body>
</html>
