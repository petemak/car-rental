<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reviews Moderation | Rwanda Roadways Admin</title>
  <meta name="description" content="Approve, reject, or reply to submitted reviews before they go live." />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="admin-topbar">
    <button type="button" class="nav-toggle" id="sidebar-toggle" aria-label="Toggle menu" style="border-color:rgba(255,255,255,.5);">☰</button>
    <a class="admin-topbar__brand" href="dashboard.html">Rwanda Roadways <span style="opacity:.7;font-weight:400;">Admin</span></a>
    <div class="admin-topbar__user">
      <span id="admin-user-name">Staff</span>
      <button type="button" class="btn btn-outline-light btn-sm" id="admin-logout-btn">Log out</button>
    </div>
  </div>

  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation">
      <ul class="admin-nav">
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="fleet.html">Fleet</a></li>
        <li><a href="bookings.html">Bookings</a></li>
        <li><a href="customers.html">Customers</a></li>
        <li data-role-restricted><a href="pricing.html">Pricing</a></li>
        <li><a href="reviews.html" aria-current="page">Reviews</a></li>
        <li><a href="content.html">Content</a></li>
        <li data-role-restricted><a href="users.html">Admin Users</a></li>
        <li data-role-restricted><a href="settings.html">Settings</a></li>
      </ul>
    </aside>

    <div class="admin-main">
      <div class="admin-header">
        <div>
          <h1>Reviews Moderation</h1>
          <p>Approve, reject, or reply before a review appears publicly.</p>
        </div>
      </div>

      <div class="admin-toolbar">
        <div class="admin-toolbar__filters">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option value="pending_moderation">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
        </div>
      </div>

      <div id="reviews-list" aria-live="polite"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/data/mock-data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/format.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/admin-shell.js"></script>
  <script src="../js/pages/admin-reviews.js"></script>
</body>
</html>
